name: distroav-obs-studio
base: core24
version: 6.2.1
title: DistroAV (OBS NDI plugin)
summary: NDI integration for OBS Studio
description: |
  DistroAV (formerly OBS-NDI) is a plugin for OBS Studio that adds NDI®
  (Network Device Interface) support, allowing you to send and receive
  high-quality, low-latency audio and video over your local network.

  This plugin provides:
  - NDI Source: Receive NDI video/audio in OBS
  - NDI Output: Send OBS video/audio as NDI
  - NDI Filter: Apply NDI output to individual sources
  - Preview Output: Send the OBS preview as NDI
  - Audio Output: Send audio to NDI

  NDI® is a registered trademark of Vizrt NDI AB.

contact: https://github.com/astrojuanlu/distroav-obs-studio-snap
website: https://github.com/DistroAV/DistroAV
source-code: https://github.com/DistroAV/DistroAV
issues: https://github.com/astrojuanlu/distroav-obs-studio-snap

grade: devel
confinement: strict

platforms:
  amd64:

slots:
  obs-plugins:
    interface: content
    source:
      read:
        - /${CRAFT_PROJECT_NAME}

parts:
  prepare-hook:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/snap/hooks/
      echo -e '#!/bin/bash\nsnapctl set :obs-plugins snapname='"${CRAFT_PROJECT_NAME}" > ${CRAFT_PART_INSTALL}/snap/hooks/prepare-slot-obs-plugins

  libndi:
    after:
      - prepare-hook
    plugin: nil
    build-packages:
      - curl
      - libarchive-tools
    override-pull: |
      curl -L -o ${CRAFT_PART_SRC}/Install_NDI_SDK_v6_Linux.tar.gz \
        https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz
      echo "f0314f245446defc488b63ceb4689acf1a965aeefdadacb70571bb216a8cc183  ${CRAFT_PART_SRC}/Install_NDI_SDK_v6_Linux.tar.gz" | sha256sum -c
    override-build: |
      set -eux
      cd ${CRAFT_PART_SRC}
      tar -xzf Install_NDI_SDK_v6_Linux.tar.gz
      _target_line="$(sed -n '/^__NDI_ARCHIVE_BEGIN__$/=' Install_NDI_SDK_v6_Linux.sh)"
      _target_line="$((_target_line + 1))"
      tail -n +"$_target_line" Install_NDI_SDK_v6_Linux.sh | tar -zxf - "NDI SDK for Linux/lib/x86_64-linux-gnu/" "NDI SDK for Linux/NDI SDK License Agreement.txt" "NDI SDK for Linux/licenses/libndi_licenses.txt"
      install -D -m755 "NDI SDK for Linux/lib/x86_64-linux-gnu/libndi.so.6".*.* -t ${CRAFT_PART_INSTALL}/${CRAFT_PROJECT_NAME}/lib/
      install -D -m644 "NDI SDK for Linux/NDI SDK License Agreement.txt" -t ${CRAFT_PART_INSTALL}/${CRAFT_PROJECT_NAME}/licenses/
      install -D -m644 "NDI SDK for Linux/licenses/libndi_licenses.txt" -t ${CRAFT_PART_INSTALL}/${CRAFT_PROJECT_NAME}/licenses/
      cd ${CRAFT_PART_INSTALL}/${CRAFT_PROJECT_NAME}/lib/
      ln -s libndi.so.6.*.* libndi.so.6

  distroav:
    after:
      - prepare-hook
    source: https://github.com/DistroAV/DistroAV.git
    source-type: git
    source-tag: 6.2.1
    plugin: cmake
    build-snaps:
      - obs-studio/latest/stable
    build-packages:
      - ninja-build
      - libcurl4-openssl-dev
      - libgles2-mesa-dev
      - libsimde-dev
      - qt6-base-dev
      - libqt6svg6-dev
      - qt6-base-private-dev
    build-environment:
      - CMAKE_PREFIX_PATH: /snap/obs-studio/current/usr/
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DENABLE_FRONTEND_API=ON
      - -DENABLE_QT=ON
      - -DCMAKE_CXX_FLAGS=-Wno-error=deprecated-declarations
      - -G Ninja
    organize:
      usr/lib/*/obs-plugins/distroav.so: ${CRAFT_PROJECT_NAME}/plugins/distroav.so
      usr/share/obs/obs-plugins/distroav: ${CRAFT_PROJECT_NAME}/data
    prime:
      - -usr/lib/*/obs-plugins
      - -usr/share/obs/obs-plugins
