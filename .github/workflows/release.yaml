name: Release to Snap Store

on:
  push:
    branches: [main]

jobs:
  release:
    uses: obs-plugins-snaps/workflows/.github/workflows/release-to-edge.yml@main
    with:
      plugin_name: "distroav"
      # DistroAV builds take up to ~1h on a cold cache; the default cap is
      # 60 minutes and cancels the job before the build finishes.
      timeout-minutes: 180
    secrets: inherit
